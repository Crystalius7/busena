function makeCrypto(subtle) {

      { name: 'PBKDF2', salt: salt, iterations: iterations, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      true,
      ['encrypt', 'decrypt']

    return new Uint8Array(await subtle.exportKey('raw', key));

    var ct = await subtle.encrypt({ name: 'AES-GCM', iv: iv }, key, enc.encode(text));
    return bytesToB64(new Uint8Array(ct));

  async function decryptText(key, ivB64, ctB64) {
    var iv = b64ToBytes(ivB64);
    var ct = b64ToBytes(ctB64);
    var pt = await subtle.decrypt({ name: 'AES-GCM', iv: iv }, key, ct);

  }

  // SHA-256 of the 32 raw key bytes plus a fixed label, first 40 hex characters: unguessable
  // without the password (the relays - our own Cloudflare one and ntfy.sh - see the name and the time of each ping, never any data);
  // tools/status-site.js computes the same names on the PC.
  async function topicFor(rawKeyBytes, label) {
    var labelBytes = enc.encode(label);
    var buf = new Uint8Array(rawKeyBytes.length + labelBytes.length);
    buf.set(rawKeyBytes, 0); buf.set(labelBytes, rawKeyBytes.length);

  // Builds and sends the encrypted "remind" command for one client, on the private cmd channel.
  // Every page command (remind, start, unqueue) goes this way: the fields given plus the time and a fresh nonce,
  // encrypted with the page key. It throws when the post fails.
  // A comment of the outbox always goes with its FIRST press time (pat): the server keeps that as the message's time, so a resend (a
  // Remove too) never moves it.
  function withPressAt(obj) {
    if (!obj || obj.cmd !== 'comment' || typeof obj.pat === 'number' || typeof obj.cid !== 'string' || !hasOwn(outbox, obj.cid)) return obj;
    return Object.assign({}, obj, { pat: outbox[obj.cid].at });
  }
  async function sendCmd(obj) {
    if (!keyRawBytes) throw new Error('locked');
    obj = withPressAt(obj);
    var ivBytes = new Uint8Array(12);
    window.crypto.getRandomValues(ivBytes);
    var nonceBytes = new Uint8Array(16);
    window.crypto.getRandomValues(nonceBytes);
    var nonce = '';
    for (var i = 0; i < nonceBytes.length; i++) nonce += ('0' + nonceBytes[i].toString(16)).slice(-2);
    var cmd = Object.assign({}, obj, { at: Date.now(), nonce: nonce });
    var encKey = await core.importEncryptKey(keyRawBytes);
    var ctBuf = await window.crypto.subtle.encrypt(
      { name: 'AES-GCM', iv: ivBytes }, encKey, new TextEncoder().encode(JSON.stringify(cmd)));
    var body = JSON.stringify({ v: 1, iv: core.bytesToB64(ivBytes), ct: core.bytesToB64(new Uint8Array(ctBuf)) });
    if (utf8Len(body) > FRAME_MAX) { var big = new Error('command too long'); big.tooLong = true; throw big; }
    var topicName = cmdChannel || await core.cmdTopic(keyRawBytes);
    var res = await postChannel(topicName, body);
    if (res.status === 429) sendQuotaAt = Date.now();
    if (!res.ok) throw new Error('http ' + res.status);
    return nonce;
  }

  function mergeAsked() {

  async function requestRemind(c, btn) {

      askedRemind.add(c.key);

    clockTimer = setInterval(tickClock, 1000);
  }

  function resetRefreshBtn() {
    var btn = document.getElementById('refreshBtn');
    btn.disabled = false; btn.textContent = 'Refresh';
  }

  function onUnlocked(theKey, payload, data, rawBytes) {
    key = theKey;
    refreshAskedAt = 0;
    resetRefreshBtn();
    topic = null;
    seenChannel = null; lastCheckedAt = 0; lastPublishHandled = 0;
    keyRawBytes = rawBytes || null;
    cmdChannel = null;
    askedRemind.clear(); pendingTask = {}; managerPending = null; stopPending = null;
    staleCt = null;
    if (seenTimer) { clearInterval(seenTimer); seenTimer = null; }
    closeSeenSocket();
    // The channel names resolve later: startChannels drops one that resolves after a lock or a later login.
    if (rawBytes) {
      startChannels({
        gen: function () { return lockGen; }, key: function () { return key; },
        refreshTopic: core.refreshTopic, seenTopic: core.seenTopic, cmdTopic: core.cmdTopic,
        setRefresh: function (t) { topic = t; }, setSeen: function (t) { seenChannel = t; }, setCmd: function (t) { cmdChannel = t; },
        startSeen: startSeenLoop
      }, rawBytes);
    }
    currentSalt = payload.salt;
    lastCt = payload.ct;
    setLoginNotice('');
    showApp();
    render(data);
    startStore(lockGen);
    startLoops();
  }

  async function tryStoredKey(payload, isStale) {
    var storedRaw;
    try { storedRaw = localStorage.getItem(STORAGE_KEY); } catch (e) { storedRaw = null; }
    if (!storedRaw) return false;
    try {
      var stored = JSON.parse(storedRaw);
      if (!stored || stored.salt !== payload.salt) {
        // the salt changed server-side (password changed): the remembered key can never decrypt
        // this payload, so forget it and fall through to the login screen instead of trying.
        try { localStorage.removeItem(STORAGE_KEY); } catch (e2) { /* ignore */ }
        return false;
      }
      var bytes = core.b64ToBytes(stored.key);
      var k = await core.importKeyBytes(bytes);
      var text = await core.decryptText(k, payload.iv, payload.ct);
      var data = JSON.parse(text);
      if (isStale && isStale()) return true; // a login or lock came meanwhile: leave the page as it is
      onUnlocked(k, payload, data, bytes);
      return true;
    } catch (e) {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e2) { /* ignore */ }
      return false;
    }
  }

  var flow = makeBootFlow({
    hasKey: function () { return !!key; },
    fetchPayload: fetchPayload,
    tryStoredKey: tryStoredKey,
    showLogin: showLogin,
    onLoadError: function () {
      setNotice(LOAD_ERROR, 'error');
      setLoginNotice(LOAD_ERROR, 'error', 'load');
    },
    onLoadOk: function () {
      if (loginNoticeSrc === 'load') setLoginNotice('');
      clearFetchError();
    },
    later: function (fn, ms) { setTimeout(fn, ms); }
  });

  // The login form works from the start: a submit before the data has loaded waits for it.
  document.getElementById('loginForm').addEventListener('submit', async function (ev) {
    ev.preventDefault();
    if (unlocking && loginLockGen === lockGen) return;
    var input = document.getElementById('passwordInput');
    var btn = document.getElementById('loginBtn');
    var password = input.value;
    var remember = document.getElementById('rememberBox').checked;
    var mine = ++loginAttempt;
    loginLockGen = lockGen;
    unlocking = true;
    btn.disabled = true; btn.textContent = 'Unlocking…'; btn.setAttribute('aria-busy', 'true');
    document.getElementById('loginError').textContent = '';
    try {
      await runLogin({
        nextPayload: flow.nextPayload,
        deriveKey: function (payload) { return core.deriveKey(password, payload.salt, payload.iter); },
        decryptText: function (k, payload) { return core.decryptText(k, payload.iv, payload.ct); },
        exportKeyBytes: core.exportKeyBytes,
        bytesToB64: core.bytesToB64,
        hasKey: function () { return !!key; },
        lockGen: function () { return lockGen; },
        bootGen: function () { return flow.bootGen; },
        remember: function (salt, b64) { localStorage.setItem(STORAGE_KEY, JSON.stringify({ salt: salt, key: b64 })); },
        forget: function () { localStorage.removeItem(STORAGE_KEY); },
        onUnlocked: onUnlocked
      }, remember);
    } catch (e) {
      if (mine === loginAttempt) {
        document.getElementById('loginError').textContent = 'Wrong password.';
        input.focus();
        input.select();
      }
    } finally {
      if (mine === loginAttempt) {
        unlocking = false;
        btn.disabled = false; btn.textContent = 'Unlock'; btn.removeAttribute('aria-busy');
      }
    }
  });

  // A hidden tab may be dropped by the browser: the typed texts are written out now.
  document.addEventListener('visibilitychange', function () { if (document.hidden) syncDrafts(); });

  function lock() {
    // Every one of these must happen synchronously, before and independent of any network
    // request: bump the generation counter first so an in-flight poll from before locking can
    // never render into the now-locked page.
    var flushed = flushDraftsOnLock();   // the latest typed text, with the key as it still is; the screen is cleared at once below
    picClearAll();   // pictures not sent yet are forgotten (the relay drops them within 12 hours)
    lockGen++;
    var lockedGen = lockGen;
    flushed.then(function (r) {
      if (r.failed && lockedGen === lockGen) setLoginNotice('Locked, but ' + r.failed + ' of your latest typed texts could not be kept on this device.', 'warn', 'lock');
    });
    cancelRepoRetry();
    flow.lock(); // also drops the cached login payload: an immediate login waits for the fresh one
    stopPoll();
    stopClock();
    if (seenTimer) { clearInterval(seenTimer); seenTimer = null; }
    closeSeenSocket();
    key = null; currentSalt = null; lastCt = null; staleCt = null; lastData = null; topic = null; refreshAskedAt = 0;
    seenChannel = null; lastCheckedAt = 0; lastPublishHandled = 0;
    keyRawBytes = null; cmdChannel = null; askedRemind.clear(); pendingTask = {}; managerPending = null; stopPending = null;
    poller.reset();
    resetRefreshBtn();
    clearApp();
    setBadge(null);
    setNotice('');
    document.getElementById('passwordInput').value = '';
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) { /* ignore */ }
    showLogin('');
    setLoginNotice('Locked. The password is forgotten on this device.', 'info', 'lock');
    // Fetching a fresh payload for the next login is best-effort and never blocks the lock itself.
    flow.boot();
  }

  document.getElementById('lockBtn').addEventListener('click', lock);
  document.getElementById('refreshBtn').addEventListener('click', askRefresh);
  var reserveBox = document.getElementById('reserve');
  reserveBox.addEventListener('click', toggleReserve);
  reserveBox.addEventListener('keydown', function (ev) {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggleReserve(); }
  });
  document.getElementById('skipLink').addEventListener('click', function (ev) { ev.preventDefault(); jumpTo('tasksCol'); });

  // A wide-screen column scrolls on its own, so it takes the keyboard focus (tabindex 0) and a keyboard user can scroll
  // it with no focusable item inside; on a narrow screen it stays -1 (a jump target only).
  var wideMq = typeof window.matchMedia === 'function' ? window.matchMedia('(min-width: 1000px)') : null;
  function syncColFocus() {
    ['mailCol', 'tasksCol'].forEach(function (id) {
      var c = document.getElementById(id);
      if (c) c.setAttribute('tabindex', wideMq && wideMq.matches ? '0' : '-1');
    });
  }
  syncColFocus();
  if (wideMq) { if (wideMq.addEventListener) wideMq.addEventListener('change', syncColFocus); else if (wideMq.addListener) wideMq.addListener(syncColFocus); }

  // The summaries tab: its switch, the back button, the phone chip, and the address #summaries (opened on load and on
  // back/forward). A redraw put off while he picks or types in the view runs once he has left its boxes.
  document.getElementById('summariesBtn').addEventListener('click', function () { setSummaries(!summariesOn); });
  document.getElementById('sumBannerOpen').addEventListener('click', function () { setSummaries(true); });
  document.getElementById('sumBack').addEventListener('click', function () { setSummaries(false); });
  document.getElementById('mgrReportsBtn').addEventListener('click', function () { setMgrView(!mgrViewOn); });
  document.getElementById('mgrBack').addEventListener('click', function () { setMgrView(false); });
  window.addEventListener('hashchange', function () { setSummaries(window.location.hash === '#summaries'); });
  document.getElementById('sumFolders').addEventListener('focusout', function () {
    setTimeout(function () {
      if (summariesDeferred && lastData && !inSumEditing(document.getElementById('sumFolders'))) drawSummaries();
    }, 400);
  });
  // The drafts were kept in localStorage by an earlier version: they go, and nothing is kept there any more.
  try { localStorage.removeItem('busena-summary-drafts'); } catch (e) { /* no storage: nothing to remove */ }
  setSummaries(window.location.hash === '#summaries');

  flow.boot();
})();
</script>
</body>
</html>
